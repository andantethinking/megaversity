<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f54eb">
<title>MEGAversity 유학생 만족도 조사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+Khmer:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
/* VOICE  친구가 건네는 짧은 질문지 — 밝고 가볍지만 공식 조사다운 단정함
   IDEA   세 캠퍼스가 이어진 지도 위에서 여러 나라 말로 인사하는 카드 한 장씩 넘기기
   PICTURE 표지: 세 대학 노드를 잇는 궤도 + 4개 언어 말풍선 / 문항: 큰 선택 카드, 표정 아이콘
   COLOUR 일렉트릭 블루(주), 연한 라벤더 바탕(보조), 선샤인 옐로(강조), 척도는 블루↔코랄
   TYPE   Pretendard 800 제목, 본문 17px · 크메르·중국어는 Noto, 줄바꿈 keep-all(한) / normal(中·크메르) */
:root{color-scheme:light;
 --blue:#2f54eb;--blue2:#1d3bc4;--sky:#eef1ff;--ink:#141a33;--mute:#5d6583;--line:#e2e6f3;--bg:#f5f6fb;--card:#fff;
 --sun:#ffcc33;--mint:#1fbf9f;--coral:#ff6b6b;--f5:#2f54eb;--f4:#5f86ff;--f3:#a3aac0;--f2:#ff9a76;--f1:#ff5d5d;
 --r:18px;--sh:0 1px 2px rgba(20,26,51,.06),0 8px 24px -12px rgba(20,26,51,.18)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 Pretendard,"Pretendard Variable","Noto Sans KR","Noto Sans Khmer","Noto Sans SC",system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word;overflow-x:clip;min-height:100dvh}
:lang(zh) body,:lang(zh) *{word-break:normal;line-break:strict}
:lang(zh).bx body,:lang(zh).bx *{word-break:keep-all;overflow-wrap:anywhere}
:lang(km) body,:lang(km) *{word-break:normal}
:lang(km) body{line-height:1.85}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;font-size:max(16px,1em)}
html,body{overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
.pv{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--coral);color:#fff;text-align:center;font-size:13px;padding:6px}

/* ---------- 표지 ---------- */
.hero{position:relative;background:var(--blue);color:#fff;overflow:hidden;padding:max(22px,env(safe-area-inset-top)) 20px 0}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:36px;background:var(--bg);border-radius:28px 28px 0 0}
.hin{max-width:640px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.01em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--sun);display:grid;place-items:center;color:var(--ink);font-style:normal;font-weight:800;font-size:15px}
.brand span{opacity:.8;font-weight:500}
.art{display:block;width:100%;height:auto;margin:10px 0 0}
.hero h1{font-size:clamp(28px,7.4vw,40px);line-height:1.18;font-weight:800;margin:6px 0 10px;text-wrap:balance;letter-spacing:-.01em}
:lang(km) .hero h1{font-size:clamp(23px,6vw,32px);line-height:1.5}
.hero p.sub{margin:0 0 16px;opacity:.9;font-size:16px;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:56px}
.chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chips span.y{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.langbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:-18px;position:relative;z-index:2}
.langbox h2{font-size:15px;margin:0 0 12px;color:var(--mute);font-weight:600}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:64px;transition:border-color .15s,background .15s}
.lg b{font-size:17px;font-weight:700}
.lg small{font-size:12.5px;color:var(--mute)}
.lg[aria-pressed=true]{border-color:var(--blue);background:var(--sky)}
.lg[aria-pressed=true] b{color:var(--blue)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:14px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:800;box-shadow:0 10px 22px -10px rgba(47,84,235,.8);transition:transform .12s,background .15s}
.cta:active{transform:scale(.98)}
.cta:disabled{background:#b7c1e8;box-shadow:none;cursor:not-allowed}
.cta svg{width:20px;height:20px}
.nw{white-space:nowrap}
p,li,.tx,.qt,.hint{text-wrap:pretty}
/* 카드뉴스 */
.deckwrap{padding:12px 16px 120px}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px;scroll-padding:0 16px}
.deck::-webkit-scrollbar{display:none}
.cn{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;border-radius:24px;background:var(--card);box-shadow:var(--sh);padding:26px 22px;min-height:calc(100dvh - 230px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.cn .kk{font-size:13px;font-weight:800;color:var(--blue);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.cn .kk i{font-style:normal;background:var(--sky);border-radius:99px;padding:3px 10px;white-space:nowrap;flex:none}
.cn h2{font-size:clamp(23px,6.4vw,30px);line-height:1.3;font-weight:800;margin:0 0 16px;text-wrap:balance;letter-spacing:-.01em}
:lang(km) .cn h2{font-size:clamp(20px,5.6vw,25px);line-height:1.6}
.cn p{margin:0 0 12px;font-size:16.5px;line-height:1.7;color:#2b3150}
.cn .num{position:absolute;right:18px;top:10px;font-size:84px;font-weight:800;line-height:1;color:var(--sky);z-index:0}
.cn>*{position:relative;z-index:1}
.cn.blue{background:var(--blue);color:#fff}.cn.blue p{color:#eef1ff}.cn.blue .kk{color:var(--sun)}.cn.blue .kk i{background:rgba(255,255,255,.16)}
.cn.sun{background:#fff7d6}
.cn .art{margin:auto 0 0;padding-top:10px}
.tiles{display:grid;gap:10px;margin:4px 0 12px}
.tile{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:16px;padding:14px}
.tile b.n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px}
.tile div{font-size:15.5px;line-height:1.6}
.tile strong{display:block;font-size:16px;margin-bottom:2px}
.flow{display:grid;gap:6px;margin:6px 0 16px}
.fc{display:flex;align-items:center;gap:10px;background:var(--sky);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px}
.fc b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px}
.fa{font-style:normal;color:var(--blue);text-align:center;font-weight:800;line-height:1}
.rem2{font-size:13px;color:var(--mute);line-height:1.6;margin-top:auto!important;padding-top:10px}
.notice2{font-size:13.5px;color:#5a4a00;background:#ffefb0;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.sig{margin-top:auto;font-size:14px;color:var(--mute);line-height:1.7}
.sig b{color:var(--ink)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:99px;background:#cfd5ea;transition:width .2s,background .2s}
.dots i.on{width:22px;background:var(--blue)}
.swipe{font-size:12.5px;color:var(--mute);text-align:center;margin:6px 0 0}
.ttl{flex:1;font-weight:800;font-size:15px;text-align:center}
.wmain{padding-bottom:110px}
.anon{font-size:13px;color:var(--mute);text-align:center;margin:14px 0 6px}
.foot{text-align:center;color:var(--mute);font-size:12.5px;padding:18px 0 calc(28px + env(safe-area-inset-bottom))}
.foot a{color:inherit}

/* ---------- 상단 바 ---------- */
.top{position:sticky;top:0;z-index:10;background:rgba(245,246,251,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:max(10px,env(safe-area-inset-top)) 0 10px}
.tin{max-width:640px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.ib{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.pg{flex:1;display:flex;flex-direction:column;gap:5px}
.pg .bar{height:8px;background:#dfe3f2;border-radius:99px;overflow:hidden}
.pg .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#5f86ff);border-radius:99px;transition:width .35s ease}
.pg .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:600}
.lbtn{flex:none;height:40px;padding:0 12px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.lbtn svg{width:16px;height:16px}

/* ---------- 문항 ---------- */
.view{animation:in .32s ease both}
.view.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
.deckwrap.view{animation-name:fade}
.view.drag{transition:none;animation:none}
.view.fly{transition:transform .22s ease-in,opacity .22s ease-in;transform:translateX(-70vw)!important;opacity:0!important}
.view.flyb{transition:transform .22s ease-in,opacity .22s ease-in;transform:translateX(70vw)!important;opacity:0!important}
.swhint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:8;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--mute);pointer-events:none;transition:opacity .3s}
.swhint svg{width:22px;height:22px;color:var(--blue);animation:bob 1.4s ease-in-out infinite}
.nodock .swhint{bottom:calc(22px + env(safe-area-inset-bottom))}
@keyframes bob{0%,100%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.pull{position:fixed;right:10px;top:50%;z-index:7;pointer-events:none}
.pull i{display:grid;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;box-shadow:0 8px 18px -8px rgba(47,84,235,.9)}
.pull i.on{opacity:1;transform:scale(1)}
.pull i svg{width:20px;height:20px}
.qwrap{padding:14px 0 110px}
.qh{margin:6px 2px 18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--ink);color:#fff;white-space:nowrap}
.tag.t{background:var(--sky);color:var(--blue)}
.tag.n{background:#fff4cc;color:#7a5a00}
.qt{font-size:clamp(20px,5.4vw,24px);line-height:1.45;font-weight:800;margin:0;letter-spacing:-.01em}
:lang(km) .qt{font-size:clamp(18px,4.8vw,21px);line-height:1.75}
.req{color:var(--coral)}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px 16px;min-height:62px;box-shadow:var(--sh);transition:border-color .15s,background .15s,transform .1s;line-height:1.45;font-size:16.5px}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.m .k{border-radius:8px;background:#fff;border:2px solid #c9d0ea;color:transparent}
.opt .face{flex:none;width:38px;height:38px}
.opt .lv{flex:none;width:34px;height:28px}
.opt .tx{flex:1}
.opt .sc{flex:none;font-weight:800;color:#c3c9dd;font-size:15px}
.opt[aria-checked=true]{border-color:var(--blue);background:var(--sky)}
.opt[aria-checked=true] .k{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt[aria-checked=true] .sc{color:var(--blue)}
.opt:disabled{opacity:.4;cursor:not-allowed;transform:none}
.other{margin-top:10px}
.field{width:100%;font-size:16.5px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.field:focus{border-color:var(--blue);outline:none}
textarea.field{min-height:150px;resize:vertical;line-height:1.55}
.count{font-size:13.5px;color:var(--mute);font-weight:600;margin:12px 2px 0;display:flex;gap:8px;align-items:center}
.count b{color:var(--blue)}
.err{color:var(--coral);font-weight:700;font-size:14.5px;margin:12px 2px 0}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fnav{position:fixed;left:0;right:0;bottom:0;z-index:9;pointer-events:none;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.ios-float .fnav{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.ios-float .qwrap,.ios-float .part,.ios-float .cardview,.ios-float .wmain{padding-bottom:180px}

.fnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fab{pointer-events:auto;flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(47,84,235,.75);transition:transform .12s,background .15s}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.94)}
.fab.gh{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.fab.gh[hidden]{display:grid;visibility:hidden}
.fab.pill{width:auto;border-radius:999px;padding:0 22px 0 24px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.fab.pill svg{width:20px;height:20px}
.fhint{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:700;color:var(--mute);text-align:center;line-height:1.3}
.fhint svg{width:20px;height:20px;color:var(--blue);animation:bob 1.4s ease-in-out infinite}
.cardview{padding:12px 0 104px}
.cardview .cn{min-height:calc(100dvh - 196px);box-shadow:var(--sh)}
.orgs{display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:14px}
.orgs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.orgs img{height:42px;max-width:170px;object-fit:contain}
.orgs figcaption{font-size:11.5px;color:var(--mute);font-weight:600}
.cn .orgs{box-shadow:none;background:rgba(255,255,255,.75);margin:auto 0 0}
.hlogos{position:absolute;right:0;top:0;display:flex;gap:6px;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
.hlogos img{height:22px;max-width:90px;object-fit:contain}
@media(max-width:520px){.hlogos{display:none}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:linear-gradient(to top,var(--bg) 70%,rgba(245,246,251,0));padding:18px 0 calc(14px + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;gap:10px}
.dock .cta{margin:0}
.ghost{flex:none;min-height:58px;padding:0 18px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--sh);font-weight:700;color:var(--mute)}

/* 파트 시작 */
.part{padding:26px 0 110px;text-align:left}
.pnum{display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:var(--ink);font-weight:800;border-radius:99px;padding:6px 14px;font-size:14px}
.part h2{font-size:clamp(26px,7vw,34px);line-height:1.25;margin:16px 0 8px;font-weight:800;text-wrap:balance}
:lang(km) .part h2{font-size:clamp(22px,6vw,28px);line-height:1.6}
.part p{color:var(--mute);margin:0 0 22px}
.part svg.pa{width:100%;height:auto;display:block;border-radius:var(--r);background:var(--sky)}
.plist{display:flex;gap:6px;margin-top:18px}
.plist i{flex:1;height:6px;border-radius:9px;background:#dfe3f2}
.plist i.on{background:var(--blue)}

/* 연락처 */
.gift{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.gift svg{flex:none;width:52px;height:52px}
.gift p{margin:0;font-size:15px}
.consent{font-size:13px;color:var(--mute);background:#fff;border:1px dashed #cdd3ea;border-radius:14px;padding:12px 14px;margin:0 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

/* 완료 */
.done{text-align:center;padding:12vh 0 60px}
.done svg.ok{width:96px;height:96px}
.done h2{font-size:clamp(26px,7vw,32px);margin:18px 0 8px;font-weight:800}
.done p{color:var(--mute);margin:0 0 6px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff4cc;color:#7a5a00;font-weight:700;border-radius:99px;padding:8px 14px;margin-top:14px;font-size:14px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* 언어 시트 */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,26,51,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet h3{margin:0 0 12px;font-size:16px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.closed{padding:16vh 0;text-align:center}
.rv{background:var(--ink);color:#fff;font-size:12.5px;text-align:center;padding:7px 12px;line-height:1.45}
.rv b{color:var(--sun);margin-right:6px}
.tag.c{background:#ffe1e1;color:#b42318}
@media (min-width:720px){.hero{padding-top:34px}.qwrap{padding-top:28px}.hero::after{height:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="pv" class="pv" hidden></div>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* =========================================================================
   MEGAversity 유학생 만족도 조사 — 공통 모듈 (설문 페이지 · 관리자 페이지 공용)
   - CONFIG.API_URL 에 Apps Script 웹앱 URL을 넣으면 구글 시트에 저장

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function tr(obj, lang) { if (!obj) return ''; return (obj[lang] && String(obj[lang]).trim()) ? obj[lang] : (obj.ko || ''); }
function hasLang(obj, lang) { return !!(obj && obj[lang] && String(obj[lang]).trim()); }
const isQuestion = (it) => !['section', 'contact'].includes(it.type);
function optValue(item, idx) { return item.type === 'scale' ? item.options.length - idx : idx + 1; }
function optIndex(item, v) { return item.type === 'scale' ? item.options.length - Number(v) : Number(v) - 1; }
function optLabel(item, v, lang = 'ko') { const o = (item.options || [])[optIndex(item, v)]; return o ? tr(o.t, lang) : String(v); }
function isVisible(item, answers) {
  if (!item.cond || !item.cond.q) return true;
  const a = answers[item.cond.q];
  if (a == null || a === '') return false;
  const vals = Array.isArray(a) ? a : [a];
  return vals.some((v) => item.cond.in.map(Number).includes(Number(v)));
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function nowStr() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
/* 응답(객체) → 시트 한 행(평면 객체). 복수응답은 '1;3' 형태 */
function flattenAnswers(survey, answers) {
  const row = {};
  for (const it of survey.items) {
    if (!isQuestion(it)) continue;
    const vis = isVisible(it, answers);
    const a = vis ? answers[it.id] : undefined;
    row[it.id] = Array.isArray(a) ? a.join(';') : (a == null ? '' : a);
    if ((it.options || []).some((o) => o.other)) row[it.id + '_기타'] = vis ? (answers[it.id + '_기타'] || '') : '';
  }
  return row;
}
/* 시트 한 행 → 응답 객체 */
function parseRow(survey, obj) {
  const ans = {};
  for (const it of survey.items) {
    if (!isQuestion(it)) continue;
    const raw = obj[it.id];
    if (raw === '' || raw == null) continue;
    if (it.type === 'multi') ans[it.id] = String(raw).split(';').filter(Boolean).map(Number);
    else if (it.type === 'scale' || it.type === 'single') ans[it.id] = Number(raw);
    else ans[it.id] = String(raw);
    if (obj[it.id + '_기타']) ans[it.id + '_기타'] = String(obj[it.id + '_기타']);
  }
  return ans;
}

/* ---------- 저장소: Apps Script API 또는 데모(localStorage) ---------- */
const Store = (() => {
  const mem = {};
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return k in mem ? mem[k] : d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; } };
  const del = (k) => { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } };
  return { get, set, del };
})();

const GAS = typeof google !== 'undefined' && google.script && google.script.run; // Apps Script 웹앱에서 열린 경우
const Api = {
  demo: !CONFIG.API_URL && !GAS,
  async request(action, data = {}) {
    if (this.demo) return Demo[action](data);
    if (GAS) return new Promise((res, rej) => google.script.run
      .withSuccessHandler((r) => (r && r.ok ? res(r) : rej(new Error((r && r.error) || '요청 실패'))))
      .withFailureHandler((e) => rej(e instanceof Error ? e : new Error(String(e))))
      .api(Object.assign({ action }, data)));
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 프리플라이트 회피
      body: JSON.stringify({ action, ...data })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '요청 실패');
    return json;
  }
};

      }
      const d = new Date(Date.now() - Math.random() * 9 * 864e5), p = (x) => String(x).padStart(2, '0');

      const rid = 'D' + (Date.now() + i).toString(36).toUpperCase();
      const nat = ans['D0'];
      list.push(Object.assign({ 응답ID: rid, 제출시각: ts, 언어: nat === 1 ? 'vi' : nat === 2 ? 'km' : nat === 3 ? 'zh' : 'ko', '소요시간(초)': 300 + Math.floor(Math.random() * 600) }, flattenAnswers(s, ans)));

    }
    list.sort((a, b) => a.제출시각.localeCompare(b.제출시각));

    return { ok: true };
  }

function introCards() {
  const m = S.survey.meta, cards = [];
  const lines = T(m.intro).split('\n').map((l) => l.trim()).filter(Boolean);
  let section = '', cur = { kind: 'hello', kicker: T(m.kicker), title: '', blocks: [] };
  const push = () => { if (cur.title || cur.blocks.length) cards.push(cur); };
  for (const l of lines) {
    if (l.startsWith('## ')) { push(); section = l.slice(3); cur = { kicker: section, title: '', blocks: [] }; continue; }
    if (l.startsWith('### ')) {
      push(); const h = l.slice(4), mm = h.match(/^([\d០-៩]+)[.)]\s*/);
      cur = { kicker: section, title: mm ? h.slice(mm[0].length) : h, num: mm ? mm[1] : '', blocks: [] }; continue;
    }
    if (cur.kind === 'hello' && !cur.title && !cur.blocks.length) { cur.title = l; continue; }
    if (l.startsWith('- ')) { const last = cur.blocks[cur.blocks.length - 1]; if (last && last.t === 'ul') last.items.push(l.slice(2)); else cur.blocks.push({ t: 'ul', items: [l.slice(2)] }); }
    else if (l.startsWith('※')) cur.blocks.push({ t: 'rem', s: l });
    else if (l.includes('→')) cur.blocks.push({ t: 'flow', s: l });
    else cur.blocks.push({ t: 'p', s: l });
  }
  push();
  cards.forEach((c) => { if (!c.title) { c.title = c.kicker; c.kicker = ''; } });
  cards.push({ kind: 'final' });
  return cards;
}

function flowHtml(str) {

  const segs = parts.map(seg);

function otherSelected(it) {

}
function qHtml(it) {

  if (it.type === 'contact') {
    const c = S.contact;
    return `<div class="qh"><h2 class="qt">${fmt(title)}</h2></div>
      <div class="gift">${giftArt()}<p>${fmt(T(it.text))}</p></div>
      <p class="consent">${fmt(note)}</p>
      <div class="row2">
        <button class="opt" data-consent="Y" role="radio" aria-checked="${c.consent === 'Y'}"><span class="k">✓</span><span class="tx">${esc(L('agree'))}</span></button>

  let body = '';
  if (it.type === 'scale' || it.type === 'single' || it.type === 'multi') {

      return `<button class="opt${multi ? ' m' : ''}" data-v="${v}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${on}">${lead}<span class="tx">${fmt(T(o.t))}</span>${it.type === 'scale' ? `<span class="sc">${v}</span>` : ''}</button>`;
    }).join('')}</div>`;

  } else if (it.type === 'text') body = `<input class="field" type="text" id="tx" value="${esc(a || '')}" placeholder="${esc(L('textPh'))}">`;

}
function setNextEnabled(it) {
  return;
  const b = $('#next'); if (!b) { stepView(); return; }
  if (RV() || !it.required || it.type === 'contact') return;
  b.disabled = !answered(it);
}
function bindQ(it) {
  const q = $('#q');
  if (it.type === 'contact') {
    q.querySelectorAll('[data-consent]').forEach((b) => b.onclick = () => {
      S.contact.consent = b.dataset.consent; saveDraft();
      q.querySelectorAll('[data-consent]').forEach((x) => x.setAttribute('aria-checked', x === b));
      const ph = $('#phone'); ph.hidden = S.contact.consent !== 'Y'; if (ph.hidden) { ph.value = ''; S.contact.phone = ''; } else ph.focus();
    });
    $('#phone').oninput = (e) => { S.contact.phone = e.target.value.trim(); saveDraft(); };
    return;
  }
  const tx = $('#tx');
  if (tx) { tx.oninput = () => { if (tx.value.trim()) S.answers[it.id] = tx.value; else delete S.answers[it.id]; saveDraft(); refreshDock(it); }; tx.onkeydown = (e) => { if (e.key === 'Enter' && tx.tagName === 'INPUT') next(); }; }
  const etc = $('#etc');
  if (etc) etc.oninput = () => { S.answers[it.id + '_기타'] = etc.value; saveDraft(); };
  q.querySelectorAll('.opt[data-v]').forEach((b) => b.onclick = () => choose(it, Number(b.dataset.v)));
  updateOpts(it);
}
function refreshDock(it) {
  const optional = !it.required;
  const sk = $('#skip');
  if (optional && sk && answered(it)) { sk.remove(); }
  return;
  setNextEnabled(it);
}
function choose(it, v) {
  $('#err').hidden = true;
  if (it.type === 'multi') {
    let arr = (S.answers[it.id] || []).slice();
    const none = it.options.map((o, i) => o.none ? optValue(it, i) : null).filter((x) => x != null);
    if (arr.includes(v)) arr = arr.filter((x) => x !== v);
    else if (none.includes(v)) arr = [v];
    else { arr = arr.filter((x) => !none.includes(x)); if (!it.max || arr.length < it.max) arr.push(v); else { toast(L('maxPick', { n: it.max })); return; } }
    if (arr.length) S.answers[it.id] = arr; else delete S.answers[it.id];
    saveDraft(); updateOpts(it); setNextEnabled(it);
    return;
  }
  S.answers[it.id] = v; saveDraft();
  if (otherSelected(it)) { stepView(); setTimeout(() => $('#etc') && $('#etc').focus(), 60); return; }
  updateOpts(it);
  clearTimeout(choose.t); choose.t = setTimeout(next, 260);
}
function updateOpts(it) {
  const q = $('#q'); if (!q) return;
  const a = S.answers[it.id], sel = Array.isArray(a) ? a : [a];
  q.querySelectorAll('.opt[data-v]').forEach((b) => {
    const on = sel.includes(Number(b.dataset.v)); b.setAttribute('aria-checked', on);
    if (it.type === 'multi') b.disabled = !on && it.max && sel.filter((x) => x != null).length >= it.max;
  });
  const o = q.querySelector('.other'); if (o) o.hidden = !otherSelected(it);
  const c = $('#cnt'); if (c) c.innerHTML = `<b>${esc(L('picked', { n: (a || []).length }))}</b>${it.max ? ' · ' + esc(L('maxPick', { n: it.max })) : ''}`;
}
function validate(it) {
  if (RV()) return true;
  let msg = '';
  if (it.type === 'contact') { if (S.contact.consent === 'Y' && !/^01[016789]-?\d{3,4}-?\d{4}$/.test(S.contact.phone)) msg = L('phoneBad'); }
  else if (it.required && !answered(it)) msg = L('required');
  else if (otherSelected(it) && !(S.answers[it.id + '_기타'] || '').trim()) msg = L('otherPh');
  if (msg) { const e = $('#err'); e.textContent = msg; e.hidden = false; const q = $('#q'); q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake'); }
  return !msg;
}
function go(key, dir) { S.cur = key; S.view = 'step'; S.dir = dir; saveDraft(); stepView(); }
function prev() {
  const st = steps(), i = st.findIndex((s) => s.key === S.cur);
  if (i <= 0) { S.view = 'intro'; S.card = 99; S.dir = -1; saveDraft(); render(); window.scrollTo(0, 0); return; }
  go(st[i - 1].key, -1);
}
async function next() {
  clearTimeout(choose.t);
  const st = steps(), i = st.findIndex((s) => s.key === S.cur), step = st[i];
  if (step.kind === 'q' && !validate(step.it)) return;
  if (i < st.length - 1) return go(st[i + 1].key, 1);
  const btn = $('#nx'); btn.disabled = true; btn.textContent = L('sending');
  try {
    const gift = S.contact.consent === 'Y' && S.contact.phone;
    if (!PREVIEW) {
      const row = flattenAnswers(S.survey, S.answers); if (RV()) row['구분'] = '검토';
      await Api.request('submit', { row, lang: S.lang, durationSec: S.started ? Math.round((Date.now() - S.started) / 1000) : '', contact: gift ? { phone: S.contact.phone } : null });
      Store.del('mv_draft');
    }
    S.answers = {}; S.started = null; S.cur = null; S.contact = { consent: '', phone: '' }; S.view = 'done'; S.gift = !!gift;
    render();
  } catch (e) { btn.disabled = false; btn.innerHTML = esc(L('submit')) + ' ' + ICON.arrow; toast(L('fail')); }
}
function doneView() {
  $('#app').innerHTML = `<main class="wrap done view">
    <svg class="ok" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#2f54eb"/><circle cx="48" cy="48" r="36" fill="#5f86ff"/><path d="M30 49l12 12 25-27" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>${esc(L('doneTitle'))}</h2><p>${fmt(T(S.survey.meta.thanks) || L('doneBody'))}</p>
    ${S.gift ? `<span class="badge">${esc(U('giftOn'))}</span>` : ''}
    <div style="margin-top:28px"><button class="ghost" id="again">${esc(L('again'))}</button></div>${orgsHtml()}</main><div class="conf" id="conf"></div>`;
  $('#again').onclick = () => { S.view = 'welcome'; render(); window.scrollTo(0, 0); };

    const cols = ['#2f54eb', '#ffcc33', '#1fbf9f', '#ff8a65', '#5f86ff'];

    setTimeout(() => { const c = $('#conf'); if (c) c.innerHTML = ''; }, 4800);
  }
}
function langSheet() {

  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = `<div class="in" role="dialog" aria-label="${esc(U('lang'))}"><h3>${esc(U('lang'))} · Language</h3><div class="lgrid">${LANGS.map((l) => `<button class="lg" data-lang="${l.code}" aria-pressed="${S.lang === l.code}" ${act.includes(l.code) ? '' : 'disabled'}><b>${esc(l.name)}</b><small>${esc(l.ko)}</small></button>`).join('')}</div></div>`;
  el.onclick = (e) => { const b = e.target.closest('.lg'); if (b && !b.disabled) { S.lang = b.dataset.lang; saveDraft(); el.remove(); S.dir = 0; render(); } else if (e.target === el) el.remove(); };
  document.body.appendChild(el);
}
/* ---------- 쇼츠처럼 세로로 밀어 넘기기 ---------- */
(() => {
  let y0 = null, x0 = 0, t0 = 0, v = null, busy = false, horiz = null;
  const reset = () => { if (v) { v.classList.remove('drag'); v.style.transform = ''; v.style.opacity = ''; } const p = $('#pullI'); if (p) p.classList.remove('on'); };
  const fly = (fwd, fn) => {
    if (busy) return; busy = true; S.swiped = true;
    const el = $('.view');
    if (el && !matchMedia('(prefers-reduced-motion: reduce)').matches) { el.classList.remove('drag'); el.style.transform = ''; el.classList.add(fwd ? 'fly' : 'flyb'); setTimeout(() => { busy = false; fn(); }, 200); }
    else { busy = false; fn(); }
  };
  const SW_VIEWS = ['step', 'intro', 'welcome'];
  const canSwipe = (e) => SW_VIEWS.includes(S.view) && !document.querySelector('.sheet') && !(e.target.closest && e.target.closest('textarea,input'));
  const goNext = () => { if (S.view === 'intro') introNext(); else if (S.view === 'welcome') { const g = $('#go'); if (g) g.click(); } else next(); };
  const goPrev = () => { if (S.view === 'intro') introPrev(); else if (S.view === 'step') prev(); };
  let lastTap = 0;
  document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTap < 320 && !(e.target.closest && e.target.closest('button,a,label,input,textarea,select,[role=button],.opt,.lg,.fab'))) e.preventDefault(); lastTap = n; }, { passive: false });
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('touchstart', (e) => {
    if (!canSwipe(e) || e.touches.length !== 1) { y0 = null; return; }
    const t = e.touches[0];
    if (t.clientX < 24 || t.clientX > innerWidth - 24) { y0 = null; return; } /* 화면 가장자리는 브라우저 뒤로가기 제스처에 양보 */
    y0 = t.clientY; x0 = t.clientX; t0 = Date.now(); v = $('.view'); horiz = null;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (y0 == null || !v) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(dx) > Math.abs(dy) * 1.2;
    if (!horiz) return;
    if (S.view === 'welcome' && dx > 0) return;
    v.classList.add('drag'); v.style.transform = `translateX(${dx * 0.4}px)`; v.style.opacity = String(1 - Math.min(Math.abs(dx) / 900, .3));
    const p = $('#pullI'); if (p) p.classList.toggle('on', dx < -70);
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (y0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0, th = Date.now() - t0 < 350 ? 45 : 80;
    y0 = null;
    if (!horiz || Math.abs(dx) < Math.abs(dy)) { reset(); return; }
    if (dx < -th) { const ok = trySwipeNext(); if (ok) fly(true, goNext); else reset(); }
    else if (dx > th && S.view !== 'welcome') fly(false, goPrev);

  });

    if (S.view !== 'step') return true;
    const st = steps(), i = st.findIndex((x) => x.key === S.cur), step = st[i];

    return step.kind === 'section' || validate(step.it);
  }
})();
document.addEventListener('keydown', (e) => {
  if (S.view === 'intro' && !document.querySelector('.sheet')) {
    if (['ArrowRight', 'ArrowDown', 'Enter'].includes(e.key)) { e.preventDefault(); introNext(); }
    if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { e.preventDefault(); introPrev(); }
    return;
  }
  if (S.view !== 'step' || document.querySelector('.sheet')) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  const st = steps(), step = st.find((s) => s.key === S.cur); if (!step) return;
  if (e.key === 'Enter' || e.key === 'ArrowRight') { next(); return; }
  if (e.key === 'ArrowLeft') { prev(); return; }
  if (step.kind === 'q' && /^[1-9]$/.test(e.key)) { const b = document.querySelectorAll('.opt[data-v]')[Number(e.key) - 1]; if (b && !b.disabled) b.click(); }
});

/* 중국어는 띄어쓰기가 없어 BudouX로 구(句) 단위 경계를 찾아 그 자리에서만 줄바꿈 */
let BX = null, bxLoading = null;
function loadBudoux() {
  if (BX || bxLoading) return bxLoading;
  bxLoading = import('https://cdn.jsdelivr.net/npm/budoux@0.6.4/+esm').then((m) => { BX = m.loadDefaultSimplifiedChineseParser(); }).catch(() => { BX = null; });
  return bxLoading;
}
function phraseify(root) {
  if (S.lang !== 'zh' || !BX) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => /[\u4e00-\u9fff]/.test(n.data) && !n.parentElement.closest('script,style,textarea,.lg,.lbtn') ? 1 : 2 });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  for (const n of list) { if (n.data.includes('\u200b')) continue; n.data = BX.parse(n.data).join('\u200b'); }
}
new MutationObserver(() => { if (S.lang === 'zh') { if (BX) phraseify($('#app')); else loadBudoux().then(() => phraseify($('#app'))); } })
  .observe(document.getElementById('app'), { childList: true, subtree: true });
(() => {
  const ua = navigator.userAgent, ios = /iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const v = Number((ua.match(/Version\/(\d+)/) || [])[1] || 0);
  const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|KAKAOTALK|NAVER|Instagram|FBAN|Line\//.test(ua);
  if (ios && safari && !navigator.standalone) document.documentElement.classList.add('ios-float');
})();
(async function init() {
  if (PREVIEW) { const p = $('#pv'); p.hidden = false; p.textContent = ui('ko', 'preview'); }
  try {
    const r = await Api.request('getSurvey');
    S.survey = r.survey && r.survey.items && r.survey.items.length ? r.survey : clone(DEFAULT_SURVEY);
    S.settings = Object.assign(S.settings, r.settings || {});
  } catch (e) { S.survey = clone(DEFAULT_SURVEY); }
  const act = S.settings.activeLangs || ['ko'];
  const d = !PREVIEW && Store.get('mv_draft', null);
  const fresh = d && (!d.at || Date.now() - d.at < 1000 * 60 * 60 * 24 * 14); /* 2주 지난 임시저장은 무시 */
  if (fresh && ((d.answers && Object.keys(d.answers).length) || d.view === 'step' || d.view === 'intro')) {
    /* 새로고침해도 응답·위치 유지. 문항이 바뀌었으면 지금 있는 문항의 응답만 남김 */
    const ids = new Set((S.survey.items || []).map((x) => x.id));
    const ans = {}; Object.entries(d.answers || {}).forEach(([k, val]) => { if (ids.has(k.replace(/_기타$/, ''))) ans[k] = val; });
    Object.assign(S, { answers: ans, lang: d.lang || 'ko', cur: d.cur || null, view: d.view === 'step' ? 'step' : (d.view === 'intro' ? 'intro' : 'welcome'), card: d.card || 0, started: d.started });
    if (d.contact) S.contact = Object.assign(S.contact || {}, d.contact);
    if (Object.keys(ans).length || S.view === 'step') setTimeout(() => toast(ui(S.lang, 'restore')), 300);
  } else {
    const nl = (navigator.language || '').slice(0, 2).toLowerCase(); if (act.includes(nl)) S.lang = nl;
  }
  if (!PREVIEW && !act.includes(S.lang)) S.lang = act[0] || 'ko';
  render();
})();
}
